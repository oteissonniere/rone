# Example rone config file.
#
# Copy this to `rone.toml` (in your working directory) or to
# `~/.config/rone/rone.toml`, then adjust the values. A file named
# `config.example.toml` is NOT picked up automatically.
#
# Each [profiles.<name>] table defines a server/model profile. `base_url` and
# `model` fall back to rone's built-in defaults when omitted; `min_confidence`
# (0..=1), `api_key` and `timeout` (seconds) are optional.

# The profile used when --profile is not given. Must name a profile below.
default_profile = "local"

[profiles.local]
# A local /v1/systemone endpoint (e.g. LM Studio).
base_url = "http://localhost:1234/v1"
model = "laya"
# Only accept answers with at least this confidence (0..=1).
min_confidence = 0.8

[profiles.production]
base_url = "https://api.example.com/v1"
model = "laya-2"
min_confidence = 0.9
# API key sent as a Bearer token. Use "env:VAR" to read it from the
# environment instead of writing the secret in this file.
# api_key = "env:RONE_API_KEY"
# Request timeout in seconds.
# timeout = 30
