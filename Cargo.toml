[package]
name = "rone"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Rust CLI that makes System One decision models pleasant to use from the command line."

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1.0"
