[package]
name = "rone"
version = "0.2.1"
edition = "2024"
default-run = "rone"
license = "MIT"
description = "A small Rust CLI that makes System One decision models pleasant to use from the command line."
readme = "README.md"
keywords = ["cli", "systemone", "decision-model", "inference"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# `rustls-tls` keeps the build free of system OpenSSL so every target
# (macOS/Linux, native or cross-compiled) builds identically in CI.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON objects in insertion order, so the mock server
# sees question options in the order the client sent them.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1.0"
axum = "0.8"
