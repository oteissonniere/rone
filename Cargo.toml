[package]
name = "rone"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small Rust CLI that makes System One decision models pleasant to use from the command line."

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON objects in insertion order, so the mock server
# sees question options in the order the client sent them.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1.0"
axum = "0.8"
